# air: rebuild and restart the daemon on save.
# The binary loads ./.env itself; `make dev` adds OPTICORE_ENV_FILE when
# ENV_FILE names another file. air does not read .env on its own.

root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/opticore ./cmd/opticore"
  bin = "./tmp/opticore"
  args_bin = ["serve"]
  delay = 300
  stop_on_error = true
  send_interrupt = true
  kill_delay = "2s"

[log]
  time = true
  main_only = false

[color]
  main = "magenta"
  watcher = "cyan"
  build = "yellow"
  runner = "green"

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true

[[watch]]
  include_dir = ["cmd", "internal", "migrations"]
  include_ext = ["go", "sql"]
  exclude_dir = ["tmp", "bin", ".git"]
  exclude_regex = ["_test\\.go"]
  exclude_unchanged = true
