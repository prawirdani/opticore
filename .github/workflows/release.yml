name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build binaries
        run: |
          set -eu
          v="${GITHUB_REF_NAME}"
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=$v" \
              -o "dist/opticore_${v}_linux_${arch}" ./cmd/opticore
          done
          cd dist && sha256sum * > checksums.txt && cat checksums.txt
      - name: verify version
        run: ./dist/opticore_${GITHUB_REF_NAME}_linux_amd64 version
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
