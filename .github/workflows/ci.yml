name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  OPTICORE_TEST_DSN: postgres://postgres:postgres@localhost:5432/opticore_test?sslmode=disable

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: opticore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: vet
        run: go vet ./...
      - name: build
        run: go build ./...
      - name: test
        # OPTICORE_TEST_DSN is set above; without it the database tests skip.
        run: go test -race -count=1 ./...
      - name: docker image builds
        run: docker build -t opticore:ci .
